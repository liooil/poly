name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.93.0"

jobs:
  rustpython-bridge:
    name: RustPython bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component clippy,rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run bridge tests
        run: cargo test --workspace --locked

  bun-contract:
    name: Bun SDK and patch contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.2

      - name: Bundle TypeScript SDK example
        run: bun build examples/main.ts --target bun --outdir .poly/sdk-check

      - name: Enforce the no-subprocess runtime boundary
        shell: bash
        run: |
          if git grep -En \
            'Command::new|std::process::Command|Bun\.spawn|child_process|std::sync::mpsc' \
            -- crates sdk examples scripts; then
            echo "The runtime boundary must stay in-process and same-thread." >&2
            exit 1
          fi

      - name: Check the patch against the pinned Bun source
        shell: bash
        run: |
          bun_repository="$(sed -n 's/^repository = "\(.*\)"/\1/p' upstream.toml)"
          bun_commit="$(sed -n 's/^commit = "\(.*\)"/\1/p' upstream.toml)"
          test -n "$bun_repository"
          printf '%s' "$bun_commit" | grep -Eq '^[0-9a-f]{40}$'

          bun_checkout="$RUNNER_TEMP/bun-upstream"
          git init "$bun_checkout"
          git -C "$bun_checkout" remote add origin "$bun_repository"
          git -C "$bun_checkout" fetch --depth 1 origin "$bun_commit"
          git -C "$bun_checkout" sparse-checkout init --no-cone
          git -C "$bun_checkout" sparse-checkout set \
            Cargo.toml \
            scripts/build/bun.ts \
            src/bun_bin/Cargo.toml \
            src/bun_bin/lib.rs \
            src/jsc/bindings/BunObject+exports.h \
            src/jsc/bindings/BunObject.cpp \
            src/jsc/bindings/windows/rescle.cpp \
            src/runtime/Cargo.toml \
            src/runtime/api/BunObject.rs \
            src/runtime/api/bun/spawn/stdio.rs \
            src/runtime/dns_jsc/options_jsc.rs \
            src/runtime/node/node_fs.rs
          git -C "$bun_checkout" checkout --detach FETCH_HEAD
          git -C "$bun_checkout" apply --check \
            "$GITHUB_WORKSPACE/patches/bun-in-process.patch"
