name: Bun integration build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.2"
  CARGO_INCREMENTAL: "0"
  LLVM_VERSION_MAJOR: "21"
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

jobs:
  linux-x64:
    name: Build and smoke-test Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Bun build dependencies
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename="$(lsb_release -cs)"
          echo \
            "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION_MAJOR} main" |
            sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-${LLVM_VERSION_MAJOR} \
            cmake \
            curl \
            golang \
            libtool \
            lld-${LLVM_VERSION_MAJOR} \
            llvm-${LLVM_VERSION_MAJOR} \
            ninja-build \
            pkg-config \
            ruby-full \
            software-properties-common \
            unzip \
            wget \
            xz-utils

      - name: Install Bun's Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup override set "$RUSTUP_TOOLCHAIN"

      - name: Build the downstream Bun executable
        shell: pwsh
        run: ./scripts/bootstrap-bun.ps1

      - name: Smoke-test direct Python entry
        shell: bash
        run: ./dist/poly examples/python_main.py -- workflow

      - name: Smoke-test TypeScript to Python
        shell: bash
        run: ./dist/poly examples/main.ts

      - name: Upload the debug executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poly-linux-x64-debug
          path: dist/poly
          if-no-files-found: error
          retention-days: 7
