name: Bun integration build

on:
  pull_request:
    paths:
      - ".github/workflows/bun-integration.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "crates/**"
      - "examples/**"
      - "patches/**"
      - "scripts/**"
      - "sdk/**"
      - "upstream.toml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.2"
  CARGO_INCREMENTAL: "0"
  LLVM_VERSION_MAJOR: "21"
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

jobs:
  build:
    name: Build and smoke-test ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            artifact_path: dist/poly
          - platform: windows-x64
            os: windows-2025
            artifact_path: dist/poly.exe

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          codename="$(lsb_release -cs)"
          echo \
            "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION_MAJOR} main" |
            sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang-${LLVM_VERSION_MAJOR} \
            cmake \
            curl \
            golang \
            libtool \
            lld-${LLVM_VERSION_MAJOR} \
            llvm-${LLVM_VERSION_MAJOR} \
            ninja-build \
            pkg-config \
            ruby-full \
            software-properties-common \
            unzip \
            wget \
            xz-utils

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-bun-windows-ci.ps1

      - name: Install Bun's Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup override set "$RUSTUP_TOOLCHAIN"

      - name: Build the downstream Bun executable
        shell: pwsh
        run: ./scripts/bootstrap-bun.ps1 -Configuration Release

      - name: Smoke-test direct Python entry and TypeScript to Python
        shell: pwsh
        run: |
          $poly = if ($IsWindows) { ".\dist\poly.exe" } else { "./dist/poly" }
          & $poly examples/python_main.py -- workflow
          if ($LASTEXITCODE -ne 0) {
              throw "Direct Python smoke test failed with exit code $LASTEXITCODE."
          }
          & $poly examples/main.ts
          if ($LASTEXITCODE -ne 0) {
              throw "TypeScript to Python smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poly-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
