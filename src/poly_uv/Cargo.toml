[package]
name = "poly_uv"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "In-process uv integration for Poly"

[dependencies]
fs-err = "=3.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["fs", "rt"] }
toml = "=0.9.12"
uv-cache = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-distribution-filename = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-extract = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-install-wheel = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-platform-tags = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-preview = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-pypi-types = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-resolver = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }
uv-workspace = { git = "https://github.com/astral-sh/uv.git", rev = "507230998c9541d67814b57463ac00e454ff6991" }

[dev-dependencies]
zip = { version = "=8.4.0", default-features = false }

[lints.clippy]
# uv's project model is intentionally isolated from Bun's allocator/IO stack.
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
