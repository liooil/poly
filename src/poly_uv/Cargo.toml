[package]
name = "poly_uv"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "In-process uv integration for Poly"

[dependencies]
fs-err = "=3.3.1"
poly_python.workspace = true
rustix = { workspace = true, features = ["system"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "net", "rt", "time"] }
uv-cache = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-client = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-configuration = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-distribution-filename = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-distribution-types = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-extract = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-fs = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700", features = ["tokio"] }
uv-install-wheel = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-normalize = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-pep440 = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-pep508 = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-platform-tags = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-preview = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-pypi-types = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-resolver = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }
uv-workspace = { git = "https://github.com/astral-sh/uv.git", rev = "210d1f6785e95a8c8c0d53e284408c9be1134700" }

[target.'cfg(windows)'.dependencies]
windows-version = "=0.1.7"

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false }

[lints.clippy]
# uv's project model is intentionally isolated from Bun's allocator/IO stack.
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"
