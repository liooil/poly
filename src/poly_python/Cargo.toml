[package]
name = "poly_python"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Embedded RustPython backend for the Polyglot Bun fork"

[dependencies]
malachite-bigint = "=0.9.1"
libc = "=0.2.183"
rustpython = { version = "0.5.0", default-features = false, features = [
    "freeze-stdlib",
    "host_env",
    "importlib",
    "stdio",
    "threading",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.clippy]
# poly_python is a standalone embedded crate outside Bun's allocator/IO
# stack; std collections, std::fs and std::env are appropriate here.
disallowed_methods = "allow"
disallowed_types = "allow"
disallowed_macros = "allow"